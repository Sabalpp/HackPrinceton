[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "farcare-collector"
version = "0.1.0"
description = "FarCare local Fitbit collection, Google Health import, and Tiger Data pipeline"
requires-python = ">=3.9"
dependencies = [
    "async-timeout==4.0.3",
    "bleak==0.22.3",
    "pyobjc-core==10.3.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==10.3.2; sys_platform == 'darwin'",
    "pyobjc-framework-CoreBluetooth==10.3.2; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch==10.3.2; sys_platform == 'darwin'",
    "typing_extensions==4.13.2",
    "psycopg==3.2.13",
    "psycopg-binary==3.2.13",
]

[project.optional-dependencies]
dev = ["ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["farcare_collector*"]

[tool.setuptools.package-data]
"farcare_collector.integrations" = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
