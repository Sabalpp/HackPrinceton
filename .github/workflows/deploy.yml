# Production checks on main; hosted deployment verification is manually triggered.
#
# Hosting model (see docs/architecture.md):
# - The Vercel Git integration deploys main using the root vercel.json.
# - It hosts the frontend, mounted Python API and standalone care daemon together.
# Run this workflow manually after deployment to verify the live revision/URLs.
#
# Repository variables: API_BASE_URL, WEB_BASE_URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: CI on main
    uses: ./.github/workflows/ci.yml

  backend:
    name: Vercel API smoke test
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.API_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the new version to be live
        env:
          API: ${{ vars.API_BASE_URL }}
        run: |
          for i in $(seq 1 45); do
            health=$(curl --connect-timeout 5 --max-time 10 -fsS "$API/health" || true)
            commit=$(printf '%s' "$health" | jq -r '.commit // ""' 2>/dev/null || true)
            if printf '%s' "$health" | jq -e --arg expected "$GITHUB_SHA" \
              '.status == "ok" and .database == "ok" and .commit == $expected' > /dev/null 2>&1; then
              echo "Live at $commit"; exit 0
            fi
            echo "waiting ($i/45) live=${commit:-unknown} want=$GITHUB_SHA"
            sleep 15
          done
          echo "::error::Backend did not reach $GITHUB_SHA in time. Configure GIT_COMMIT (or the host commit variable); blank/old revisions never pass."; exit 1
      - name: Smoke test API
        run: bash scripts/smoke_test.sh "${{ vars.API_BASE_URL }}"

  frontend:
    name: Frontend smoke test
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.WEB_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Availability only: this does not prove the hosted frontend's revision.
      # The required Web CI check exercises the checked-out UI against a synthetic API.
      - name: Web responds (availability only)
        env:
          WEB: ${{ vars.WEB_BASE_URL }}
        run: |
          for i in $(seq 1 20); do
            curl --connect-timeout 5 --max-time 10 -fsS -o /dev/null "$WEB" && { echo "Web is reachable; hosted frontend revision is not verified."; exit 0; }
            sleep 15
          done
          exit 1
