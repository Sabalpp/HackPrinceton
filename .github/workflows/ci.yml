# Required checks for every PR into main. Deploy (deploy.yml) re-runs this on main.
# Job `name:`s are referenced by the main-branch ruleset (scripts/setup-github.sh) — renaming a
# job means updating the ruleset too.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: Collector (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      PYTHONPATH: ${{ github.workspace }}/backend/collector:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/collector/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install collector and development checks
        run: |
          uv venv --python '${{ matrix.python-version }}' .venv-collector
          uv pip install --python .venv-collector/bin/python -e './backend/collector[dev]'
      - name: Lint and format collector, research tools, and local scripts
        run: |
          .venv-collector/bin/ruff check --config backend/collector/pyproject.toml \
            backend/collector research/fitbit_air scripts/local scripts/verification
          .venv-collector/bin/ruff format --check --config backend/collector/pyproject.toml \
            backend/collector research/fitbit_air scripts/local scripts/verification
      - name: Python syntax and synthetic unit tests
        run: |
          .venv-collector/bin/python -m compileall -q \
            backend/collector/farcare_collector scripts/local scripts/verification research/fitbit_air
          .venv-collector/bin/python -m unittest discover -s backend/collector/tests -p 'test_*.py' -v
          .venv-collector/bin/python -m unittest discover -s research/fitbit_air/tests -p 'test_*.py' -v
      - name: Local launcher lifecycle (disposable fixtures only)
        run: .venv-collector/bin/python scripts/verification/verify_launchers.py
      - name: Node publisher and Google refresh tests (no external connections)
        run: |
          node backend/collector/tests/test_tiger_publisher.cjs
          node backend/collector/tests/test_google_refresh.cjs
      - name: Build collector wheel and verify bundled SQL
        run: |
          uv build backend/collector --wheel --out-dir "$RUNNER_TEMP/collector-wheels"
          .venv-collector/bin/python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "collector-wheels").glob("*.whl"))
          assert len(wheels) == 1, "Expected one collector wheel"
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              for name in ("schema.sql", "archive.sql"):
                  asset = "farcare_collector/integrations/sql/" + name
                  assert asset in names and wheel.read(asset), "Missing packaged SQL: " + asset
              assert "farcare_collector/services/health_pipeline.py" in names
              assert not any(name.startswith(("tests/", "research/")) for name in names)
          print("Collector wheel includes the runtime modules and SQL assets.")
          PY

  api:
    name: API (lint, test, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:  # production runs on Postgres; tests run on SQLite AND Postgres
        image: postgres:16
        env:
          POSTGRES_USER: farcare
          POSTGRES_DB: farcare_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farcare"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Cloudflare process supervisor and smoke runner
        run: |
          uv run ruff check --isolated --select E,F,I --line-length 100 ../deploy/cloudflare/*.py
          uv run ruff format --isolated --check ../deploy/cloudflare/*.py
          uv run python -m unittest discover -s ../deploy/cloudflare -p 'test_*.py' -v
      - name: Native free host lifecycle
        run: |
          uv run ruff check --isolated --select E,F,I --line-length 100 ../deploy/render/*.py
          uv run ruff format --isolated --check ../deploy/render/*.py
          uv run python -m unittest discover -s ../deploy/render -p 'test_*.py' -v
          bash -n ../deploy/render/build.sh
      - name: Python syntax check
        run: uv run python -m compileall -q app scripts
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL 16)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://farcare@localhost:5432/farcare_test
      - name: Contract drift check (packages/contracts must match the code)
        run: |
          uv run python scripts/export_contracts.py
          git diff --exit-code -- ../packages/contracts || {
            echo "::error::Contracts changed without re-export. Run 'cd backend && uv run python scripts/export_contracts.py', regenerate web types, and follow the contract-change process in AGENTS.md."
            exit 1
          }

  api-image:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image (no push)
        run: docker build -t farcare-api:ci backend
      - name: Container boots and serves /health
        run: |
          docker run -d --name api -p 8000:8000 -e APP_ENV=development \
            -e DATABASE_URL=sqlite:////tmp/farcare.db farcare-api:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  web:
    name: Web (lint, typecheck, build)
    # Match the pinned browser driver's supported Linux image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api-types.ts || {
            echo "::error::lib/api-types.ts is stale. Run 'npm run gen:api' in frontend."
            exit 1
          }
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /backend
          FARCARE_API_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_USE_MOCKS: 'false'
          NEXT_PUBLIC_LOCAL_PREVIEW: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install synthetic backend and pinned browser driver
        working-directory: backend
        env:
          PLAYWRIGHT_INSTALL_DIR: ${{ runner.temp }}/farcare-playwright
        run: |
          uv sync --frozen
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            --prefix "$PLAYWRIGHT_INSTALL_DIR" playwright@1.56.1
          node "$PLAYWRIGHT_INSTALL_DIR/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify the dashboard against the real API (synthetic data only)
        working-directory: .
        env:
          PLAYWRIGHT_INSTALL_DIR: ${{ runner.temp }}/farcare-playwright
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/farcare-dashboard-smoke
          SMOKE_API_PROXY: 'true'
          SMOKE_NATIVE_HOST: 'true'
        run: node scripts/dashboard_smoke.mjs
      - name: Upload synthetic dashboard evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: synthetic-dashboard-smoke
          path: |
            ${{ runner.temp }}/farcare-dashboard-smoke/*.png
            ${{ runner.temp }}/farcare-dashboard-smoke/*.json
            ${{ runner.temp }}/farcare-dashboard-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build for the Vercel mounted API entrypoint
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /backend
          FARCARE_API_ORIGIN: http://127.0.0.1:18000/backend
          NEXT_PUBLIC_USE_MOCKS: 'false'
          NEXT_PUBLIC_LOCAL_PREVIEW: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify Vercel API routing, sessions and care flows
        working-directory: .
        env:
          PLAYWRIGHT_INSTALL_DIR: ${{ runner.temp }}/farcare-playwright
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/farcare-vercel-smoke
          SMOKE_API_PROXY: 'true'
          SMOKE_VERCEL_ENTRY: 'true'
        run: node scripts/dashboard_smoke.mjs
      - name: Upload synthetic Vercel entrypoint evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: synthetic-vercel-smoke
          path: |
            ${{ runner.temp }}/farcare-vercel-smoke/*.png
            ${{ runner.temp }}/farcare-vercel-smoke/*.json
            ${{ runner.temp }}/farcare-vercel-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --no-banner -v .

  cloudflare:
    name: Cloudflare (bundle, production containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install pinned deployment CLI
        working-directory: deploy/cloudflare
        run: npm ci --no-audit --no-fund
      - name: Deployment and routing regression tests
        working-directory: deploy/cloudflare
        run: npm test
      - name: Bundle the Worker with synthetic settings (no publication)
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          WORKER_NAME: farcare-ci
          PUBLIC_ORIGIN: https://farcare-ci.synthetic.workers.dev
          DATABASE_URL: postgresql://synthetic:ci-only@postgres/farcare_ci?sslmode=require
          INGEST_API_KEY: synthetic-ci-ingest-key-never-use-in-production
          WRANGLER_SEND_METRICS: 'false'
        run: npm run build
      - name: Build the deployment API and web images (no push)
        run: |
          docker build -f deploy/cloudflare/Dockerfile.api -t farcare-cloudflare-api:ci .
          docker build -f deploy/Dockerfile.web --build-arg NEXT_PUBLIC_API_URL=/backend \
            -t farcare-cloudflare-web:ci frontend
      - name: Verify production boot, worker readiness, login and crash recovery
        run: python3 deploy/cloudflare/container_smoke.py
