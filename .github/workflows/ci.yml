# Required checks for every PR into main. Deploy (deploy.yml) re-runs this on main.
# Job `name:`s are referenced by the main-branch ruleset (scripts/setup-github.sh) — renaming a
# job means updating the ruleset too.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, test, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:  # production runs on Postgres; tests run on SQLite AND Postgres
        image: postgres:16
        env:
          POSTGRES_USER: farcare
          POSTGRES_DB: farcare_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farcare"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Python syntax check
        run: uv run python -m compileall -q app scripts
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL 16)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://farcare@localhost:5432/farcare_test
      - name: Contract drift check (packages/contracts must match the code)
        run: |
          uv run python scripts/export_contracts.py
          git diff --exit-code -- ../../packages/contracts || {
            echo "::error::Contracts changed without re-export. Run 'cd apps/api && uv run python scripts/export_contracts.py', regenerate web types, and follow the contract-change process in AGENTS.md."
            exit 1
          }

  api-image:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image (no push)
        run: docker build -t farcare-api:ci apps/api
      - name: Container boots and serves /health
        run: |
          docker run -d --name api -p 8000:8000 -e APP_ENV=development \
            -e DATABASE_URL=sqlite:////tmp/farcare.db farcare-api:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  web:
    name: Web (lint, typecheck, build)
    # Match the pinned browser driver's supported Linux image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api-types.ts || {
            echo "::error::lib/api-types.ts is stale. Run 'npm run gen:api' in apps/web."
            exit 1
          }
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:18000
          NEXT_PUBLIC_USE_MOCKS: 'false'
          NEXT_PUBLIC_LOCAL_PREVIEW: 'false'
          NEXT_PUBLIC_VIEWER_TOKEN: dev-child-token
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install synthetic backend and pinned browser driver
        working-directory: apps/api
        env:
          PLAYWRIGHT_INSTALL_DIR: ${{ runner.temp }}/farcare-playwright
        run: |
          uv sync --frozen
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            --prefix "$PLAYWRIGHT_INSTALL_DIR" playwright@1.56.1
          node "$PLAYWRIGHT_INSTALL_DIR/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify the dashboard against the real API (synthetic data only)
        working-directory: .
        env:
          PLAYWRIGHT_INSTALL_DIR: ${{ runner.temp }}/farcare-playwright
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/farcare-dashboard-smoke
        run: node scripts/dashboard_smoke.mjs
      - name: Upload synthetic dashboard evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: synthetic-dashboard-smoke
          path: |
            ${{ runner.temp }}/farcare-dashboard-smoke/*.png
            ${{ runner.temp }}/farcare-dashboard-smoke/*.json
            ${{ runner.temp }}/farcare-dashboard-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --no-banner -v .
